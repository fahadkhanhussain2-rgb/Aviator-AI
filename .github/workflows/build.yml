name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -o AviatorAIAnalyzer_GitHub_Folder.zip -d extracted
          cp -r extracted/AviatorAIAnalyzer/* .
          cp -r extracted/AviatorAIAnalyzer/.[!.]* . 2>/dev/null || true

      - name: Build
