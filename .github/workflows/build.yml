name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_ROOT=$(find extracted -name "settings.gradle.kts" -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle.kts was not found inside ZIP."
            echo "ZIP contents:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. .

          echo "Project files:"
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Debug APK
        run: |
          set -e
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorAIAnalyzer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
